<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sigabo Platformer</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { --game-header-clearance: 56px; margin: 0; padding: 0; width: 100%; height: 100%; background: #11355E; overflow: hidden; }
        #game { display: block; width: 100%; height: 100%; touch-action: manipulation; }
        #hud {
            position: fixed;
            top: max(12px, calc(var(--game-header-clearance) + env(safe-area-inset-top, 0px)));
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-family: sans-serif;
            color: #FFFFFF;
            font-weight: bold;
            font-size: 18px;
            pointer-events: auto;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        #overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(11,32,53,0.9);
            font-family: sans-serif;
            color: #FFFFFF;
            text-align: center;
            padding: 24px;
        }
        #overlay h1 { font-size: 28px; margin: 0 0 8px; color: #F4A935; }
        #overlay p { font-size: 16px; margin: 4px 0 20px; }
        .btn {
            border: none;
            border-radius: 24px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            margin: 6px;
            min-width: 220px;
            cursor: pointer;
        }
        .btn-primary { background: #F4A935; color: #11355E; }
        .btn-secondary { background: transparent; color: #FFFFFF; border: 2px solid #FFFFFF; }
        #start { display: flex; flex-direction: column; align-items: center; }
        #start p { max-width: 320px; margin: 4px auto 20px; text-align: center; }
        .title-logo { width: min(82vw, 420px); height: auto; margin: 0 auto 10px; display: block; }
        #controls {
            position: fixed;
            inset: auto 0 calc(28px + env(safe-area-inset-bottom, 0px)) 0;
            height: 84px;
            pointer-events: none;
            z-index: 20;
        }
        .ctrl-btn {
            position: absolute;
            pointer-events: auto;
            width: 82px;
            height: 62px;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            background: rgba(17,53,94,0.7);
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }
        #leftBtn { left: 14px; bottom: 0; }
        #rightBtn { left: 106px; bottom: 0; }
        #jumpBtn {
            right: 14px;
            bottom: 0;
            width: 98px;
            height: 72px;
            border-radius: 20px;
            background: rgba(244,169,53,0.82);
            color: #11355E;
            border-color: rgba(255,255,255,0.45);
        }
        .native-action { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.32); border-radius: 17px; color: #FFFFFF; background: rgba(17,53,94,0.5); cursor: pointer; text-shadow: none; }
        .native-action svg { width: 20px; height: 20px; fill: currentColor; }
        .native-action:active { transform: scale(0.94); }
        @media (orientation: landscape) {
            #controls { height: 70px; }
            .ctrl-btn { width: 68px; height: 48px; font-size: 20px; border-radius: 12px; }
            #rightBtn { left: 90px; }
            #jumpBtn { width: 84px; height: 56px; border-radius: 14px; }
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">
        <button class="native-action" data-native-action="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15.5 4 7.5 12l8 8 1.5-1.5-6.5-6.5L17 5.5z"/></svg></button>
        <span id="scoreLabel">Score: 0</span>
        <span id="livesLabel">Revives left: 2</span>
        <button class="native-action" data-native-action="trophy" aria-label="Trophy"><svg viewBox="0 0 24 24"><path d="M7 3h10v3h3v2c0 3.1-1.9 5.6-4.6 6.5A5 5 0 0 1 13 16.9V19h4v2H7v-2h4v-2.1a5 5 0 0 1-2.4-2.4C5.9 13.6 4 11.1 4 8V6h3V3Zm10 5v3.9A4.5 4.5 0 0 0 18 8h-1ZM6 8c0 1.6.8 3 2 3.9V8H6Zm3-3v7a3 3 0 0 0 6 0V5H9Z"/></svg></button>
    </div>
    <div id="overlay" style="display:flex;" data-screen="start">
        <div id="start">
            <img class="title-logo" src="https://github.com/mvbrazas/images/blob/main/joinnow-app/sigabo/assets/logo-sigabo-jump.png?raw=true" alt="Sigabo Dash" />
            <p>True platformer mode: move left or right, jump across rooftops, avoid danger zones, and collect markers.</p>
            <button class="btn btn-primary" id="startBtn">Start Game</button>
            <button class="btn btn-secondary" data-action="back">Back</button>
            <button class="btn btn-secondary" data-action="leaderboard">Trophies</button>
        </div>
    </div>

    <div id="controls" aria-hidden="true">
        <button class="ctrl-btn" id="leftBtn">L</button>
        <button class="ctrl-btn" id="jumpBtn">JUMP</button>
        <button class="ctrl-btn" id="rightBtn">R</button>
    </div>

    <script>
        (function () {
            var canvas = document.getElementById('game');
            var ctx = canvas.getContext('2d');
            var overlay = document.getElementById('overlay');
            var scoreLabel = document.getElementById('scoreLabel');
            var livesLabel = document.getElementById('livesLabel');
            var startBtn = document.getElementById('startBtn');
            var leftBtn = document.getElementById('leftBtn');
            var rightBtn = document.getElementById('rightBtn');
            var jumpBtn = document.getElementById('jumpBtn');

            var MAX_REVIVES = 2;
            var GROUND_RATIO = 0.84;
            var SCORE_PER_PICKUP = 10;
            var GRAVITY = 1900;
            var JUMP_VELOCITY = -720;
            var MOVE_ACCEL = 2200;
            var MAX_RUN_SPEED = 320;
            var FRICTION = 1800;

            var state = 'idle';
            var score = 0;
            var scoreFinalized = false;
            var pickupsCount = 0;
            var revivesLeft = MAX_REVIVES;

            var platforms = [];
            var hazards = [];
            var pickups = [];

            var player = {
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
                w: 64,
                h: 34,
                jumping: false,
                facing: 1,
                invulnerableUntil: 0,
            };

            var cameraX = 0;
            var segmentX = 0;
            var lastTime = 0;
            var furthestX = 0;
            var controls = { left: false, right: false };
            var audioCtx = null;

            var assets = {
                player: new Image(),
                obstacle: new Image(),
            };

            assets.player.src = 'https://github.com/mvbrazas/images/blob/main/joinnow-app/sigabo/assets/player-sigabo-runner.svg?raw=true';
            assets.obstacle.src = 'https://github.com/mvbrazas/images/blob/main/joinnow-app/sigabo/assets/obstacle-signal-spike.svg?raw=true';

            // House ad billboard rendered onto the scrolling skyline buildings.
            var HOUSEADS_API = 'http://54.254.84.189:3000/config/houseads';
            var HOUSEAD_ROTATE_MS = 8000;
            var houseAd = { image: new Image(), ready: false, url: null };
            var houseAdPool = [];
            var houseAdIndex = -1;

            function applyHouseAd(ad) {
                if (!ad || !ad.image) return;
                // Preload off-screen; the visible billboard only swaps once this finishes loading.
                var nextImage = new Image();
                nextImage.onload = function () {
                    houseAd.image = nextImage;
                    houseAd.url = ad.url || null;
                    houseAd.ready = true;
                };
                nextImage.src = ad.image;
            }

            function nextHouseAd() {
                if (!houseAdPool.length) return;
                houseAdIndex = (houseAdIndex + 1) % houseAdPool.length;
                applyHouseAd(houseAdPool[houseAdIndex]);
            }

            function loadHouseAd() {
                fetch(HOUSEADS_API)
                    .then(function (res) { return res.json(); })
                    .then(function (json) {
                        var ads = (json && json.data) || [];
                        var billboardAds = ads.filter(function (ad) { return ad && (ad.type === 'mrec' || ad.type === 'banner'); });
                        houseAdPool = billboardAds.length ? billboardAds : ads;
                        post({ type: 'houseAdsDebug', count: houseAdPool.length });
                        if (!houseAdPool.length) return;
                        houseAdIndex = Math.floor(Math.random() * houseAdPool.length) - 1;
                        nextHouseAd();
                        if (houseAdPool.length > 1) {
                            setInterval(nextHouseAd, HOUSEAD_ROTATE_MS);
                        }
                    })
                    .catch(function (err) {
                        post({ type: 'houseAdsDebug', error: String(err) });
                    });
            }
            loadHouseAd();

            function drawBillboardOnBuilding(buildingX, buildingY, buildingWidth, buildingHeight) {
                if (!houseAd.ready) return;
                var panelW = Math.min(buildingWidth - 12, 130);
                var panelH = panelW * 0.62;
                if (panelH > buildingHeight * 0.5) {
                    panelH = buildingHeight * 0.5;
                    panelW = panelH / 0.62;
                }
                var panelX = buildingX + (buildingWidth - panelW) / 2;
                var panelY = buildingY + buildingHeight * 0.18;

                var img = houseAd.image;
                var imgRatio = img.naturalWidth / img.naturalHeight;
                var panelRatio = panelW / panelH;
                var drawW, drawH;
                if (imgRatio > panelRatio) {
                    drawW = panelW;
                    drawH = drawW / imgRatio;
                } else {
                    drawH = panelH;
                    drawW = drawH * imgRatio;
                }
                ctx.drawImage(img, panelX + (panelW - drawW) / 2, panelY + (panelH - drawH) / 2, drawW, drawH);
            }

            // Deterministic per-building-index pseudo-random so the skyline never reshuffles as it scrolls.
            function seededRandom(seed) {
                var x = Math.sin(seed * 12.9898) * 43758.5453;
                return x - Math.floor(x);
            }

            var BUILDING_SLOT_WIDTH = 140;
            var BUILDING_GAP = 16;
            var AD_EVERY_N_BUILDINGS = 6;
            var BUILDING_COLORS = ['#132A46', '#16324F', '#0f2338', '#1A3A5C', '#0c1c30', '#20456b'];

            function drawBuildingWindows(x, y, width, height, litRatio, rand) {
                var padding = 8;
                var cols = Math.max(1, Math.floor((width - padding) / 14));
                var rows = Math.max(1, Math.floor((height - padding * 2) / 16));
                var cellW = (width - padding) / cols;
                var cellH = (height - padding * 2) / rows;
                for (var row = 0; row < rows; row++) {
                    for (var col = 0; col < cols; col++) {
                        var seed = rand * 1000 + row * 31 + col * 7;
                        if (seededRandom(seed) > litRatio) continue;
                        ctx.fillStyle = 'rgba(244,215,140,0.55)';
                        ctx.fillRect(
                            x + padding / 2 + col * cellW + 2,
                            y + padding + row * cellH + 2,
                            Math.max(2, cellW - 5),
                            Math.max(2, cellH - 5)
                        );
                    }
                }
            }

            function drawRooftop(x, width, y, rand) {
                if (rand < 0.35) {
                    // Antenna spire.
                    var poleX = x + width * (0.3 + rand);
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(poleX, y);
                    ctx.lineTo(poleX, y - 22 - rand * 20);
                    ctx.stroke();
                } else if (rand < 0.7) {
                    // Rooftop utility block.
                    var blockW = width * 0.32;
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(x + width * 0.5 - blockW / 2, y - 14, blockW, 14);
                }
            }

            function drawSkylineWithAds(offset, skyHeight) {
                var firstIndex = Math.floor(offset / BUILDING_SLOT_WIDTH) - 1;
                var lastIndex = Math.ceil((offset + canvas.width) / BUILDING_SLOT_WIDTH) + 1;
                for (var index = firstIndex; index <= lastIndex; index++) {
                    var heightRand = seededRandom(index);
                    var widthRand = seededRandom(index * 3.7 + 11);
                    var colorRand = seededRandom(index * 5.9 + 23);
                    var rooftopRand = seededRandom(index * 7.3 + 41);
                    var litRatio = 0.15 + seededRandom(index * 2.1 + 5) * 0.35;

                    var slotWidth = BUILDING_SLOT_WIDTH - BUILDING_GAP;
                    var width = slotWidth * (0.6 + widthRand * 0.4);
                    var height = skyHeight * (0.32 + heightRand * 0.5);
                    var x = index * BUILDING_SLOT_WIDTH - offset + (slotWidth - width) / 2;
                    var y = skyHeight - height;

                    ctx.fillStyle = BUILDING_COLORS[Math.floor(colorRand * BUILDING_COLORS.length)];
                    ctx.fillRect(x, y, width, height);
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.fillRect(x, y, width, 5);

                    drawRooftop(x, width, y, rooftopRand);
                    drawBuildingWindows(x, y, width, height, litRatio, heightRand);

                    var buildingNumber = ((index % AD_EVERY_N_BUILDINGS) + AD_EVERY_N_BUILDINGS) % AD_EVERY_N_BUILDINGS;
                    if (buildingNumber === 0) {
                        drawBillboardOnBuilding(x, y, width, height);
                    }
                }
            }

            // Stars use their own slower parallax offset so they drift behind the buildings, not with them.
            function drawNightSky(offset, skyHeight) {
                var gradient = ctx.createLinearGradient(0, 0, 0, skyHeight);
                gradient.addColorStop(0, '#040814');
                gradient.addColorStop(0.6, '#0b1a33');
                gradient.addColorStop(1, '#11355E');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                var parallaxOffset = offset * 0.15;
                var starSpacing = 60;
                var firstStar = Math.floor(parallaxOffset / starSpacing) - 1;
                var lastStar = Math.ceil((parallaxOffset + canvas.width) / starSpacing) + 1;
                var time = Date.now() * 0.002;
                for (var i = firstStar; i <= lastStar; i++) {
                    var starX = seededRandom(i * 13.7);
                    var starY = seededRandom(i * 29.3 + 4);
                    var x = i * starSpacing - parallaxOffset + starX * starSpacing;
                    var y = starY * skyHeight * 0.75;
                    var twinkle = 0.4 + Math.abs(Math.sin(time + i)) * 0.6;
                    var size = 1 + seededRandom(i * 41.1) * 1.6;
                    ctx.fillStyle = 'rgba(255,255,255,' + twinkle.toFixed(2) + ')';
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function post(message) {
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify(message));
                }
            }

            function ensureAudio() {
                if (!audioCtx) {
                    var Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    audioCtx = new Ctx();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(function () {});
                }
                return audioCtx;
            }

            function playTone(freq, duration, type, gain, delay) {
                var ctxAudio = ensureAudio();
                if (!ctxAudio) return;

                var startAt = ctxAudio.currentTime + (delay || 0);
                var osc = ctxAudio.createOscillator();
                var amp = ctxAudio.createGain();

                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, startAt);

                amp.gain.setValueAtTime(0.0001, startAt);
                amp.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain || 0.08), startAt + 0.01);
                amp.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);

                osc.connect(amp);
                amp.connect(ctxAudio.destination);

                osc.start(startAt);
                osc.stop(startAt + duration + 0.02);
            }

            function playJumpSound() {
                playTone(440, 0.07, 'square', 0.035, 0);
                playTone(700, 0.08, 'square', 0.03, 0.03);
            }

            function playPickupSound() {
                playTone(920, 0.06, 'square', 0.06, 0);
                playTone(1180, 0.07, 'square', 0.055, 0.04);
                playTone(1460, 0.08, 'triangle', 0.05, 0.09);
            }

            function playGameOverSound() {
                playTone(260, 0.11, 'sawtooth', 0.06, 0);
                playTone(190, 0.14, 'sawtooth', 0.05, 0.1);
                playTone(150, 0.18, 'triangle', 0.04, 0.23);
            }

            function playReviveSound() {
                playTone(360, 0.08, 'triangle', 0.05, 0);
                playTone(500, 0.09, 'triangle', 0.05, 0.08);
                playTone(680, 0.11, 'triangle', 0.04, 0.16);
            }

            function playClickSound() {
                playTone(620, 0.05, 'square', 0.03, 0);
            }

            function groundY() {
                return canvas.height * GROUND_RATIO;
            }

            function floorPlatformY() {
                return groundY() - 8;
            }

            function clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            }

            function intersects(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
            }

            function addSegment() {
                var floorY = floorPlatformY();
                var makeGap = Math.random() < 0.2;
                var len;

                if (makeGap) {
                    len = 110 + Math.random() * 120;
                    segmentX += len;
                    return;
                }

                len = 180 + Math.random() * 200;
                platforms.push({ x: segmentX, y: floorY, w: len, h: 24 });

                if (Math.random() < 0.35) {
                    var elevatedW = 110 + Math.random() * 90;
                    var elevatedY = floorY - (80 + Math.random() * 70);
                    var elevatedX = segmentX + 35 + Math.random() * Math.max(20, len - elevatedW - 45);
                    platforms.push({ x: elevatedX, y: elevatedY, w: elevatedW, h: 18 });
                    if (Math.random() < 0.7) {
                        pickups.push({ x: elevatedX + elevatedW * 0.5 - 10, y: elevatedY - 34, w: 20, h: 20 });
                    }
                }

                if (Math.random() < 0.45) {
                    pickups.push({ x: segmentX + len * (0.25 + Math.random() * 0.5), y: floorY - 30, w: 18, h: 18 });
                }

                if (Math.random() < 0.40) {
                    var hzW = 18 + Math.random() * 22;
                    var hzH = 22 + Math.random() * 34;
                    hazards.push({
                        x: segmentX + 26 + Math.random() * Math.max(20, len - hzW - 52),
                        y: floorY - hzH,
                        w: hzW,
                        h: hzH,
                    });
                }

                segmentX += len;
            }

            function ensureWorldFilled() {
                var targetX = cameraX + canvas.width * 2.2;
                while (segmentX < targetX) {
                    addSegment();
                }
            }

            function pruneWorld() {
                var minX = cameraX - 300;
                platforms = platforms.filter(function (p) { return p.x + p.w > minX; });
                hazards = hazards.filter(function (h) { return h.x + h.w > minX; });
                pickups = pickups.filter(function (c) { return c.x + c.w > minX; });
            }

            function placePlayerOnNearestPlatform() {
                var px = player.x + player.w * 0.5;
                var best = null;
                var bestDist = Infinity;
                for (var i = 0; i < platforms.length; i++) {
                    var p = platforms[i];
                    if (px >= p.x - 80 && px <= p.x + p.w + 80) {
                        var d = Math.abs((p.x + p.w * 0.5) - px);
                        if (d < bestDist) {
                            best = p;
                            bestDist = d;
                        }
                    }
                }
                if (!best) {
                    best = { x: player.x - 100, y: floorPlatformY(), w: 260, h: 22 };
                    platforms.push(best);
                }
                player.y = best.y - player.h;
                player.vx = 0;
                player.vy = 0;
                player.jumping = false;
            }

            function addRescuePlatform() {
                var y = floorPlatformY();
                var rescue = { x: player.x - 110, y: y, w: 260, h: 22 };
                platforms.push(rescue);
                placePlayerOnNearestPlatform();
            }

            function resetGame() {
                score = 0;
                scoreFinalized = false;
                pickupsCount = 0;
                revivesLeft = MAX_REVIVES;
                platforms = [];
                hazards = [];
                pickups = [];
                cameraX = 0;
                segmentX = -120;
                furthestX = 0;

                player.x = 40;
                player.y = floorPlatformY() - player.h;
                player.vx = 0;
                player.vy = 0;
                player.jumping = false;
                player.facing = 1;
                player.invulnerableUntil = 0;

                platforms.push({ x: -180, y: floorPlatformY(), w: 460, h: 24 });
                segmentX = 280;
                ensureWorldFilled();

                scoreLabel.textContent = 'Score: 0';
                livesLabel.textContent = 'Revives left: ' + revivesLeft;
            }

            function jump() {
                if (state !== 'playing') return;
                if (!player.jumping) {
                    player.vy = JUMP_VELOCITY;
                    player.jumping = true;
                    playJumpSound();
                }
            }

            function setControl(btn, key, isDown) {
                function apply(e) {
                    e.preventDefault();
                    controls[key] = isDown;
                }
                btn.addEventListener('pointerdown', apply);
                btn.addEventListener('pointerup', function (e) { e.preventDefault(); controls[key] = false; });
                btn.addEventListener('pointercancel', function () { controls[key] = false; });
                btn.addEventListener('pointerleave', function () { controls[key] = false; });
            }

            function showOverlay(screen, title, message, buttons) {
                overlay.setAttribute('data-screen', screen);
                overlay.style.display = 'flex';
                overlay.innerHTML = '<div><h1>' + title + '</h1><p>' + message + '</p>' + buttons + '</div>';
                var els = overlay.querySelectorAll('[data-action]');
                for (var i = 0; i < els.length; i++) {
                    els[i].addEventListener('click', onOverlayAction);
                }
            }

            function hideOverlay() {
                overlay.style.display = 'none';
            }

            function finalizeScore() {
                if (scoreFinalized) return;
                scoreFinalized = true;
                post({ type: 'gameOver', score: score, final: true });
            }

            function onOverlayAction(e) {
                ensureAudio();
                playClickSound();
                var action = e.currentTarget.getAttribute('data-action');
                if (action === 'start') {
                    resetGame();
                    hideOverlay();
                    state = 'playing';
                    post({ type: 'ready' });
                } else if (action === 'revive') {
                    post({ type: 'requestRevive', score: score });
                } else if (action === 'back') {
                    if (state === 'gameover') finalizeScore();
                    post({ type: 'goBack', score: score });
                } else if (action === 'restart') {
                    if (state === 'gameover') finalizeScore();
                    resetGame();
                    hideOverlay();
                    state = 'playing';
                } else if (action === 'leaderboard') {
                    if (state === 'gameover') finalizeScore();
                    post({ type: 'viewLeaderboard', score: score });
                }
            }

            startBtn.addEventListener('click', function () {
                ensureAudio();
                playClickSound();
                resetGame();
                hideOverlay();
                state = 'playing';
                post({ type: 'ready' });
            });

            var initialActions = overlay.querySelectorAll('[data-action]');
            for (var i = 0; i < initialActions.length; i++) {
                initialActions[i].addEventListener('click', onOverlayAction);
            }

            document.addEventListener('click', function (event) {
                var button = event.target.closest('[data-native-action]');
                if (!button) return;
                ensureAudio();
                playClickSound();
                if (button.dataset.nativeAction === 'back') post({ type: 'goBack', score: score });
                else if (button.dataset.nativeAction === 'trophy') post({ type: 'viewLeaderboard', score: score });
            });

            canvas.addEventListener('pointerdown', function (e) {
                ensureAudio();
                jump();
            });
            window.addEventListener('keydown', function (e) {
                ensureAudio();
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    e.preventDefault();
                    jump();
                } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                    controls.left = true;
                } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                    controls.right = true;
                }
            });
            window.addEventListener('keyup', function (e) {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                    controls.left = false;
                } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                    controls.right = false;
                }
            });

            setControl(leftBtn, 'left', true);
            setControl(rightBtn, 'right', true);
            jumpBtn.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                ensureAudio();
                jump();
            });

            function onGameOver() {
                state = 'gameover';
                playGameOverSound();
                var canRevive = revivesLeft > 0;
                var buttons = '<button class="btn btn-secondary" data-action="restart">Restart</button>' +
                    '<button class="btn btn-secondary" data-action="back">Back</button>' +
                    '<button class="btn btn-secondary" data-action="leaderboard">Trophies</button>';
                if (canRevive) {
                    buttons = '<button class="btn btn-primary" data-action="revive">Watch Ad to Revive</button>' + buttons;
                }
                showOverlay('gameover', 'GAME OVER', 'Score: ' + score, buttons);
                if (canRevive) post({ type: 'gameOver', score: score, final: false });
                else finalizeScore();
            }

            // Called by React Native after rewarded ad completes.
            window.dispatchRevive = function (granted) {
                if (state !== 'gameover') return;
                if (granted) {
                    playReviveSound();
                    revivesLeft -= 1;
                    addRescuePlatform();
                    hazards = hazards.filter(function (h) {
                        return h.x < player.x - 120 || h.x > player.x + 240;
                    });
                    player.invulnerableUntil = Date.now() + 2000;
                    livesLabel.textContent = 'Revives left: ' + revivesLeft;
                    hideOverlay();
                    state = 'playing';
                } else {
                    playGameOverSound();
                    var buttons = '<button class="btn btn-secondary" data-action="restart">Restart</button>' +
                        '<button class="btn btn-secondary" data-action="back">Back</button>' +
                        '<button class="btn btn-secondary" data-action="leaderboard">Trophies</button>';
                    showOverlay('gameover', 'GAME OVER', 'Score: ' + score + ' (Ad unavailable)', buttons);
                    finalizeScore();
                }
            };

            function update(dt) {
                if (state !== 'playing') return;

                if (controls.left && !controls.right) {
                    player.vx -= MOVE_ACCEL * dt;
                    player.facing = -1;
                } else if (controls.right && !controls.left) {
                    player.vx += MOVE_ACCEL * dt;
                    player.facing = 1;
                } else {
                    if (player.vx > 0) player.vx = Math.max(0, player.vx - FRICTION * dt);
                    if (player.vx < 0) player.vx = Math.min(0, player.vx + FRICTION * dt);
                }

                player.vx = clamp(player.vx, -MAX_RUN_SPEED, MAX_RUN_SPEED);

                player.x += player.vx * dt;
                if (player.x < -140) {
                    player.x = -140;
                    player.vx = 0;
                }

                player.vy += GRAVITY * dt;
                var prevY = player.y;
                player.y += player.vy * dt;
                player.jumping = true;

                var pWorld = {
                    x: player.x + 8,
                    y: player.y,
                    w: player.w - 16,
                    h: player.h,
                };

                for (var i = 0; i < platforms.length; i++) {
                    var p = platforms[i];
                    var crossingDown = prevY + player.h <= p.y && player.y + player.h >= p.y;
                    var horizontalOverlap = pWorld.x < p.x + p.w && pWorld.x + pWorld.w > p.x;
                    if (player.vy >= 0 && crossingDown && horizontalOverlap) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.jumping = false;
                        pWorld.y = player.y;
                    }
                }

                if (player.y > canvas.height + 130) {
                    onGameOver();
                    return;
                }

                furthestX = Math.max(furthestX, player.x);
                // Keep score coin-based, but scale it to be closer to runner scoring pace.
                score = pickupsCount * SCORE_PER_PICKUP;
                scoreLabel.textContent = 'Score: ' + score;

                cameraX = clamp(player.x - canvas.width * 0.35, 0, Math.max(0, segmentX - canvas.width * 0.5));
                var bgOffset = cameraX * 0.35;
                window.__sigaboBgOffset = bgOffset;

                ensureWorldFilled();
                pruneWorld();

                var invulnerable = Date.now() < player.invulnerableUntil;
                for (var h = 0; h < hazards.length; h++) {
                    if (!invulnerable && intersects(pWorld, hazards[h])) {
                        onGameOver();
                        return;
                    }
                }

                for (var c = pickups.length - 1; c >= 0; c--) {
                    if (intersects(pWorld, pickups[c])) {
                        pickups.splice(c, 1);
                        pickupsCount += 1;
                        playPickupSound();
                    }
                }
            }

            function draw() {
                var bg = window.__sigaboBgOffset || 0;
                drawNightSky(bg, groundY());

                drawSkylineWithAds(bg, groundY());

                ctx.fillStyle = '#0b2035';
                ctx.fillRect(0, groundY(), canvas.width, canvas.height - groundY());

                for (var i = 0; i < platforms.length; i++) {
                    var p = platforms[i];
                    var sx = p.x - cameraX;
                    if (sx + p.w < -40 || sx > canvas.width + 40) continue;
                    ctx.fillStyle = '#1C2C42';
                    ctx.fillRect(sx, p.y, p.w, p.h);
                    ctx.fillStyle = '#2E4B6B';
                    ctx.fillRect(sx, p.y, p.w, 6);
                }

                var invulnerable = Date.now() < player.invulnerableUntil;
                var drawX = player.x - cameraX;
                if (assets.player.complete && assets.player.naturalWidth > 0) {
                    var playerPad = 4;
                    ctx.globalAlpha = invulnerable ? 0.75 : 1;
                    ctx.save();
                    if (player.facing < 0) {
                        ctx.translate(drawX + player.w / 2, 0);
                        ctx.scale(-1, 1);
                        ctx.translate(-(drawX + player.w / 2), 0);
                    }
                    ctx.drawImage(
                        assets.player,
                        drawX - playerPad,
                        player.y - playerPad,
                        player.w + playerPad * 2,
                        player.h + playerPad * 2
                    );
                    ctx.restore();
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = invulnerable ? '#58C9D4' : '#F4A935';
                    ctx.fillRect(drawX, player.y, player.w, player.h);
                }

                for (var j = 0; j < hazards.length; j++) {
                    var hz = hazards[j];
                    var hx = hz.x - cameraX;
                    if (hx + hz.w < -30 || hx > canvas.width + 30) continue;
                    if (assets.obstacle.complete && assets.obstacle.naturalWidth > 0) {
                        ctx.drawImage(assets.obstacle, hx, hz.y, hz.w, hz.h);
                    } else {
                        ctx.fillStyle = '#CDE4FF';
                        ctx.fillRect(hx, hz.y, hz.w, hz.h);
                    }
                }

                for (var k = 0; k < pickups.length; k++) {
                    var coin = pickups[k];
                    var cx = coin.x - cameraX;
                    if (cx + coin.w < -20 || cx > canvas.width + 20) continue;
                    ctx.fillStyle = '#F4A935';
                    ctx.beginPath();
                    ctx.arc(cx + coin.w / 2, coin.y + coin.h / 2, coin.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#11355E';
                    ctx.fillRect(cx + coin.w * 0.43, coin.y + coin.h * 0.2, 2, coin.h * 0.6);
                }

                if (state === 'playing') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText('Touch L R JUMP', 14, 80);
                }
            }

            function loop(time) {
                var dt = lastTime ? Math.min(0.05, (time - lastTime) / 1000) : 0;
                lastTime = time;
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }

            resetGame();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
