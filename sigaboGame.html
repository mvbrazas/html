<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sigabo Dash</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #11355E; overflow: hidden; }
        #game { display: block; width: 100%; height: 100%; touch-action: manipulation; }
        #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-family: sans-serif; color: #FFFFFF; font-weight: bold; font-size: 18px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(11,32,53,0.9); font-family: sans-serif; color: #FFFFFF; text-align: center; padding: 24px; }
        #overlay h1 { font-size: 28px; margin: 0 0 8px; color: #F4A935; }
        #overlay p { font-size: 16px; margin: 4px 0 20px; }
        .btn { border: none; border-radius: 24px; padding: 14px 28px; font-size: 16px; font-weight: bold; margin: 6px; min-width: 220px; cursor: pointer; }
        .btn-primary { background: #F4A935; color: #11355E; }
        .btn-secondary { background: transparent; color: #FFFFFF; border: 2px solid #FFFFFF; }
        #start { display: flex; flex-direction: column; align-items: center; }
        #start p { max-width: 280px; margin: 4px auto 20px; text-align: center; }
        .title-logo { width: min(82vw, 420px); height: auto; margin: 0 auto 10px; display: block; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">
        <span id="scoreLabel">Score: 0</span>
        <span id="livesLabel">Revives left: 1</span>
    </div>
    <div id="overlay" style="display:flex;" data-screen="start">
        <div id="start">
            <img class="title-logo" src="https://github.com/mvbrazas/images/blob/main/joinnow-app/sigabo/assets/logo-sigabo-dash.png?raw=true" alt="Sigabo Dash" />
            <p>Dodge the interference. Survive as long as you can. Tap or click to jump.</p>
            <button class="btn btn-primary" id="startBtn">Start Game</button>
        </div>
    </div>
    <script>
        (function () {
            var canvas = document.getElementById('game');
            var ctx = canvas.getContext('2d');
            var overlay = document.getElementById('overlay');
            var scoreLabel = document.getElementById('scoreLabel');
            var livesLabel = document.getElementById('livesLabel');
            var startBtn = document.getElementById('startBtn');

            var MAX_REVIVES = 2;
            var GROUND_RATIO = 0.78;
            var state = 'idle';
            var score = 0;
            var scoreFinalized = false;
            var revivesLeft = MAX_REVIVES;
            var obstacles = [];
            var player = { x: 48, y: 0, vy: 0, w: 72, h: 36, jumping: false, invulnerableUntil: 0 };
            var speed = 5;
            var spawnTimer = 0;
            var lastTime = 0;
            var bgOffset = 0;
            var audioCtx = null;
            var assets = {
                player: new Image(),
                obstacle: new Image(),
            };

            assets.player.src = 'https://github.com/mvbrazas/images/blob/main/joinnow-app/sigabo/assets/player-sigabo-runner.svg?raw=true';
            assets.obstacle.src = 'https://github.com/mvbrazas/images/blob/main/joinnow-app/sigabo/assets/obstacle-signal-spike.svg?raw=true';

            // House ad billboard rendered onto the scrolling skyline buildings.
            var HOUSEADS_API = 'http://54.254.84.189:3000/config/houseads';
            var HOUSEAD_ROTATE_MS = 8000;
            var houseAd = { image: new Image(), ready: false, url: null };
            var houseAdPool = [];
            var houseAdIndex = -1;

            function applyHouseAd(ad) {
                if (!ad || !ad.image) return;
                // Preload off-screen; the visible billboard only swaps once this finishes loading.
                var nextImage = new Image();
                nextImage.onload = function () {
                    houseAd.image = nextImage;
                    houseAd.url = ad.url || null;
                    houseAd.ready = true;
                };
                nextImage.src = ad.image;
            }

            function nextHouseAd() {
                if (!houseAdPool.length) return;
                houseAdIndex = (houseAdIndex + 1) % houseAdPool.length;
                applyHouseAd(houseAdPool[houseAdIndex]);
            }

            function loadHouseAd() {
                fetch(HOUSEADS_API)
                    .then(function (res) { return res.json(); })
                    .then(function (json) {
                        var ads = (json && json.data) || [];
                        var billboardAds = ads.filter(function (ad) { return ad && (ad.type === 'mrec' || ad.type === 'banner'); });
                        houseAdPool = billboardAds.length ? billboardAds : ads;
                        post({ type: 'houseAdsDebug', count: houseAdPool.length });
                        if (!houseAdPool.length) return;
                        houseAdIndex = Math.floor(Math.random() * houseAdPool.length) - 1;
                        nextHouseAd();
                        if (houseAdPool.length > 1) {
                            setInterval(nextHouseAd, HOUSEAD_ROTATE_MS);
                        }
                    })
                    .catch(function (err) {
                        post({ type: 'houseAdsDebug', error: String(err) });
                    });
            }
            loadHouseAd();

            function drawBillboardOnBuilding(buildingX, buildingY, buildingWidth, buildingHeight) {
                if (!houseAd.ready) return;
                var panelW = Math.min(buildingWidth - 12, 130);
                var panelH = panelW * 0.62;
                if (panelH > buildingHeight * 0.5) {
                    panelH = buildingHeight * 0.5;
                    panelW = panelH / 0.62;
                }
                var panelX = buildingX + (buildingWidth - panelW) / 2;
                var panelY = buildingY + buildingHeight * 0.18;

                var img = houseAd.image;
                var imgRatio = img.naturalWidth / img.naturalHeight;
                var panelRatio = panelW / panelH;
                var drawW, drawH;
                if (imgRatio > panelRatio) {
                    drawW = panelW;
                    drawH = drawW / imgRatio;
                } else {
                    drawH = panelH;
                    drawW = drawH * imgRatio;
                }
                ctx.drawImage(img, panelX + (panelW - drawW) / 2, panelY + (panelH - drawH) / 2, drawW, drawH);
            }

            // Deterministic per-building-index pseudo-random so the skyline never reshuffles as it scrolls.
            function seededRandom(seed) {
                var x = Math.sin(seed * 12.9898) * 43758.5453;
                return x - Math.floor(x);
            }

            var BUILDING_SLOT_WIDTH = 140;
            var BUILDING_GAP = 16;
            var AD_EVERY_N_BUILDINGS = 6;
            var BUILDING_COLORS = ['#132A46', '#16324F', '#0f2338', '#1A3A5C', '#0c1c30', '#20456b'];

            function drawBuildingWindows(x, y, width, height, litRatio, rand) {
                var padding = 8;
                var cols = Math.max(1, Math.floor((width - padding) / 14));
                var rows = Math.max(1, Math.floor((height - padding * 2) / 16));
                var cellW = (width - padding) / cols;
                var cellH = (height - padding * 2) / rows;
                for (var row = 0; row < rows; row++) {
                    for (var col = 0; col < cols; col++) {
                        var seed = rand * 1000 + row * 31 + col * 7;
                        if (seededRandom(seed) > litRatio) continue;
                        ctx.fillStyle = 'rgba(244,215,140,0.55)';
                        ctx.fillRect(
                            x + padding / 2 + col * cellW + 2,
                            y + padding + row * cellH + 2,
                            Math.max(2, cellW - 5),
                            Math.max(2, cellH - 5)
                        );
                    }
                }
            }

            function drawRooftop(x, width, y, rand) {
                if (rand < 0.35) {
                    // Antenna spire.
                    var poleX = x + width * (0.3 + rand);
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(poleX, y);
                    ctx.lineTo(poleX, y - 22 - rand * 20);
                    ctx.stroke();
                } else if (rand < 0.7) {
                    // Rooftop utility block.
                    var blockW = width * 0.32;
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(x + width * 0.5 - blockW / 2, y - 14, blockW, 14);
                }
            }

            function drawSkylineWithAds(offset, skyHeight) {
                var firstIndex = Math.floor(offset / BUILDING_SLOT_WIDTH) - 1;
                var lastIndex = Math.ceil((offset + canvas.width) / BUILDING_SLOT_WIDTH) + 1;
                for (var index = firstIndex; index <= lastIndex; index++) {
                    var heightRand = seededRandom(index);
                    var widthRand = seededRandom(index * 3.7 + 11);
                    var colorRand = seededRandom(index * 5.9 + 23);
                    var rooftopRand = seededRandom(index * 7.3 + 41);
                    var litRatio = 0.15 + seededRandom(index * 2.1 + 5) * 0.35;

                    var slotWidth = BUILDING_SLOT_WIDTH - BUILDING_GAP;
                    var width = slotWidth * (0.6 + widthRand * 0.4);
                    var height = skyHeight * (0.32 + heightRand * 0.5);
                    var x = index * BUILDING_SLOT_WIDTH - offset + (slotWidth - width) / 2;
                    var y = skyHeight - height;

                    ctx.fillStyle = BUILDING_COLORS[Math.floor(colorRand * BUILDING_COLORS.length)];
                    ctx.fillRect(x, y, width, height);
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.fillRect(x, y, width, 5);

                    drawRooftop(x, width, y, rooftopRand);
                    drawBuildingWindows(x, y, width, height, litRatio, heightRand);

                    var buildingNumber = ((index % AD_EVERY_N_BUILDINGS) + AD_EVERY_N_BUILDINGS) % AD_EVERY_N_BUILDINGS;
                    if (buildingNumber === 0) {
                        drawBillboardOnBuilding(x, y, width, height);
                    }
                }
            }

            // Stars use their own slower parallax offset so they drift behind the buildings, not with them.
            function drawNightSky(offset, skyHeight) {
                var gradient = ctx.createLinearGradient(0, 0, 0, skyHeight);
                gradient.addColorStop(0, '#040814');
                gradient.addColorStop(0.6, '#0b1a33');
                gradient.addColorStop(1, '#11355E');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                var parallaxOffset = offset * 0.15;
                var starSpacing = 60;
                var firstStar = Math.floor(parallaxOffset / starSpacing) - 1;
                var lastStar = Math.ceil((parallaxOffset + canvas.width) / starSpacing) + 1;
                var time = Date.now() * 0.002;
                for (var i = firstStar; i <= lastStar; i++) {
                    var starX = seededRandom(i * 13.7);
                    var starY = seededRandom(i * 29.3 + 4);
                    var x = i * starSpacing - parallaxOffset + starX * starSpacing;
                    var y = starY * skyHeight * 0.75;
                    var twinkle = 0.4 + Math.abs(Math.sin(time + i)) * 0.6;
                    var size = 1 + seededRandom(i * 41.1) * 1.6;
                    ctx.fillStyle = 'rgba(255,255,255,' + twinkle.toFixed(2) + ')';
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function post(message) {
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify(message));
                }
            }

            function ensureAudio() {
                if (!audioCtx) {
                    var Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    audioCtx = new Ctx();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(function () {});
                }
                return audioCtx;
            }

            function playTone(freq, duration, type, gain, delay) {
                var ctxAudio = ensureAudio();
                if (!ctxAudio) return;

                var startAt = ctxAudio.currentTime + (delay || 0);
                var osc = ctxAudio.createOscillator();
                var amp = ctxAudio.createGain();

                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, startAt);

                amp.gain.setValueAtTime(0.0001, startAt);
                amp.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain || 0.08), startAt + 0.01);
                amp.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);

                osc.connect(amp);
                amp.connect(ctxAudio.destination);

                osc.start(startAt);
                osc.stop(startAt + duration + 0.02);
            }

            function playJumpSound() {
                playTone(480, 0.07, 'square', 0.04, 0);
                playTone(740, 0.08, 'square', 0.03, 0.03);
            }

            function playGameOverSound() {
                playTone(280, 0.11, 'sawtooth', 0.06, 0);
                playTone(210, 0.14, 'sawtooth', 0.05, 0.1);
                playTone(160, 0.18, 'triangle', 0.04, 0.23);
            }

            function playReviveSound() {
                playTone(380, 0.08, 'triangle', 0.05, 0);
                playTone(520, 0.09, 'triangle', 0.05, 0.08);
                playTone(700, 0.11, 'triangle', 0.04, 0.16);
            }

            function playClickSound() {
                playTone(620, 0.05, 'square', 0.03, 0);
            }

            function groundY() {
                return canvas.height * GROUND_RATIO;
            }

            function resetGame() {
                score = 0;
                scoreFinalized = false;
                revivesLeft = MAX_REVIVES;
                obstacles = [];
                speed = 5;
                spawnTimer = 0;
                player.y = groundY() - player.h;
                player.vy = 0;
                player.jumping = false;
                player.invulnerableUntil = 0;
                scoreLabel.textContent = 'Score: 0';
                livesLabel.textContent = 'Revives left: ' + revivesLeft;
            }

            function spawnObstacle() {
                var h = 28 + Math.random() * 30;
                var w = Math.max(18, h * 0.58);
                obstacles.push({ x: canvas.width + 20, y: groundY() - h, w: w, h: h });
            }

            function jump() {
                if (state !== 'playing') return;
                if (!player.jumping) {
                    player.vy = -13;
                    player.jumping = true;
                    playJumpSound();
                }
            }

            function showOverlay(screen, title, message, buttons) {
                overlay.setAttribute('data-screen', screen);
                overlay.style.display = 'flex';
                var html = '<div><h1>' + title + '</h1><p>' + message + '</p>' + buttons + '</div>';
                overlay.innerHTML = html;
                var els = overlay.querySelectorAll('[data-action]');
                for (var i = 0; i < els.length; i++) {
                    els[i].addEventListener('click', onOverlayAction);
                }
            }

            function hideOverlay() {
                overlay.style.display = 'none';
            }

            function currentScore() {
                return Math.floor(score);
            }

            function finalizeScore() {
                if (scoreFinalized) return;
                scoreFinalized = true;
                post({ type: 'gameOver', score: currentScore(), final: true });
            }

            function onOverlayAction(e) {
                ensureAudio();
                playClickSound();
                var action = e.currentTarget.getAttribute('data-action');
                if (action === 'start') {
                    resetGame();
                    hideOverlay();
                    state = 'playing';
                    post({ type: 'ready' });
                } else if (action === 'revive') {
                    post({ type: 'requestRevive', score: currentScore() });
                } else if (action === 'restart') {
                    if (state === 'gameover') finalizeScore();
                    resetGame();
                    hideOverlay();
                    state = 'playing';
                } else if (action === 'leaderboard') {
                    if (state === 'gameover') finalizeScore();
                    post({ type: 'viewLeaderboard', score: currentScore() });
                }
            }

            startBtn.addEventListener('click', function () {
                ensureAudio();
                playClickSound();
                resetGame();
                hideOverlay();
                state = 'playing';
                post({ type: 'ready' });
            });

            canvas.addEventListener('pointerdown', function () {
                ensureAudio();
                jump();
            });

            function onGameOver() {
                state = 'gameover';
                playGameOverSound();
                var canRevive = revivesLeft > 0;
                var buttons = '<button class="btn btn-secondary" data-action="restart">Restart</button>' +
                    '<button class="btn btn-secondary" data-action="leaderboard">View Leaderboard</button>';
                if (canRevive) {
                    buttons = '<button class="btn btn-primary" data-action="revive">Watch Ad to Revive</button>' + buttons;
                }
                showOverlay('gameover', 'GAME OVER', 'Score: ' + currentScore(), buttons);
                if (canRevive) post({ type: 'gameOver', score: currentScore(), final: false });
                else finalizeScore();
            }

            // Called by React Native after a rewarded ad finishes.
            window.dispatchRevive = function (granted) {
                if (state !== 'gameover') return;
                if (granted) {
                    playReviveSound();
                    revivesLeft -= 1;
                    obstacles = [];
                    player.y = groundY() - player.h;
                    player.vy = 0;
                    player.jumping = false;
                    player.invulnerableUntil = Date.now() + 2000;
                    livesLabel.textContent = 'Revives left: ' + revivesLeft;
                    hideOverlay();
                    state = 'playing';
                } else {
                    playGameOverSound();
                    var buttons = '<button class="btn btn-secondary" data-action="restart">Restart</button>' +
                        '<button class="btn btn-secondary" data-action="leaderboard">View Leaderboard</button>';
                    showOverlay('gameover', 'GAME OVER', 'Score: ' + currentScore() + ' (Ad unavailable)', buttons);
                    finalizeScore();
                }
            };

            function update(dt) {
                if (state !== 'playing') return;
                score += dt * 10;
                scoreLabel.textContent = 'Score: ' + Math.floor(score);
                speed = 5 + Math.floor(score / 200);
                bgOffset += speed * (dt * 60) * 0.45;

                player.vy += 42 * dt;
                player.y += player.vy;
                var floor = groundY() - player.h;
                if (player.y >= floor) {
                    player.y = floor;
                    player.vy = 0;
                    player.jumping = false;
                }

                spawnTimer -= dt;
                if (spawnTimer <= 0) {
                    spawnObstacle();
                    spawnTimer = Math.max(0.6, 1.4 - score / 4000);
                }

                var invulnerable = Date.now() < player.invulnerableUntil;
                for (var i = obstacles.length - 1; i >= 0; i--) {
                    var o = obstacles[i];
                    o.x -= speed * (dt * 60);
                    if (o.x + o.w < 0) {
                        obstacles.splice(i, 1);
                        continue;
                    }
                    if (!invulnerable &&
                        player.x < o.x + o.w &&
                        player.x + player.w > o.x &&
                        player.y < o.y + o.h &&
                        player.y + player.h > o.y) {
                        onGameOver();
                        return;
                    }
                }
            }

            function draw() {
                drawNightSky(bgOffset, groundY());

                drawSkylineWithAds(bgOffset, groundY());

                ctx.fillStyle = '#0b2035';
                ctx.fillRect(0, groundY(), canvas.width, canvas.height - groundY());

                var invulnerable = Date.now() < player.invulnerableUntil;
                if (assets.player.complete && assets.player.naturalWidth > 0) {
                    var playerPad = 4;
                    ctx.globalAlpha = invulnerable ? 0.75 : 1;
                    ctx.drawImage(
                        assets.player,
                        player.x - playerPad,
                        player.y - playerPad,
                        player.w + playerPad * 2,
                        player.h + playerPad * 2
                    );
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = invulnerable ? '#58C9D4' : '#F4A935';
                    ctx.fillRect(player.x, player.y, player.w, player.h);
                }

                for (var i = 0; i < obstacles.length; i++) {
                    var o = obstacles[i];
                    if (assets.obstacle.complete && assets.obstacle.naturalWidth > 0) {
                        ctx.drawImage(assets.obstacle, o.x, o.y, o.w, o.h);
                    } else {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(o.x, o.y, o.w, o.h);
                    }
                }
            }

            function loop(time) {
                var dt = lastTime ? Math.min(0.05, (time - lastTime) / 1000) : 0;
                lastTime = time;
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }

            resetGame();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
